# Local data lakehouse — Silo (S3-compatible) + Postgres (Iceberg JDBC) + Spark 3.5
# Usage: cp .env.example .env && make up && make wait && make demo
#
# Object store: SILO (pgsty fork of the archived MinIO community line).
# See docs/object-store.md. Pin immutable tags — never :latest for server/client.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ldl-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iceberg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iceberg}
      POSTGRES_DB: ${POSTGRES_DB:-iceberg}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iceberg} -d ${POSTGRES_DB:-iceberg}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - lakehouse

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    container_name: ldl-silo
    command: server /data --console-address ":9001"
    environment:
      # SILO preserves the MinIO env contract (MINIO_ROOT_*).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      # One-time note: existing MinIO volume users can
      #   docker volume ls | grep minio
      # then rename (docker volume create + copy) or re-init with make reset.
      - silo-data:/data
    healthcheck:
      # Classic image ships the silo binary; same probe as distroless.
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks:
      - lakehouse

  silo-init:
    image: docker.io/pgsty/mc:RELEASE.2026-09-03T07-13-05Z
    container_name: ldl-silo-init
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://silo:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/lake;
      mc anonymous set none local/lake;
      echo 'Bucket lake ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - lakehouse
    restart: "no"

  spark:
    build:
      context: ./docker/spark
    container_name: ldl-spark
    depends_on:
      postgres:
        condition: service_healthy
      silo:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      WAREHOUSE: ${WAREHOUSE:-s3a://lake/warehouse}
      SAMPLE_DATA_DIR: /opt/data/sample
    ports:
      - "${SPARK_UI_PORT:-4040}:4040"
    volumes:
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./src/jobs:/opt/jobs:ro
      - ./data/sample:/opt/data/sample:ro
      - ./data/export:/opt/data/export
      - ./sql:/opt/sql:ro
    networks:
      - lakehouse

volumes:
  postgres-data:
  silo-data:

networks:
  lakehouse:
    name: ldl-net
