# SILO (pgsty/silo, AGPL-3.0 MinIO fork) instead of RustFS, same service name / ports / alias:
#   make up-light STORE=silo
#   docker compose -f docker-compose.yml -f docker-compose.silo.yml --profile light up -d --wait
# Separate volume (silo-data): switching stores means `make reset` (catalog and objects must match).
services:
  objectstore:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["server", "/data", "--address", ":${S3_API_PORT:-9000}", "--console-address", ":9001"]
    environment: !override
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
      MINIO_REGION: ${S3_REGION:-us-east-1}
    volumes: !override
      - silo-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

volumes:
  silo-data:
