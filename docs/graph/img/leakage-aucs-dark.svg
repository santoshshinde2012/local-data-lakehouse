<svg xmlns="http://www.w3.org/2000/svg" width="760" height="309" viewBox="0 0 760 309" role="img" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif">
<title>Leakage demo: AUC of a neighbour lapse-rate feature, by how it was built</title>
