name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.22"

jobs:
  t0-unit:
    # T0: no containers. Static stack checks, client/SQL contracts, churn gold (pandas) -> export contract,
    # Spark SQL vs pandas gold in local pyspark 4.1.3, Retention Radar consuming the export.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==${UV_VERSION}"
      - name: Host venv from the hash-locked requirements.txt
        run: make venv
      - name: Syntax check (Python + shell)
        run: |
          .venv/bin/python -m py_compile $(git ls-files '*.py')
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
      - name: T0 unit tests
        run: .venv/bin/python -m pytest -q tests/unit
      - name: Tiny fixture -> gold -> contract
        env:
          CHURN_SAMPLE_DIR: data/sample/churn/fixtures/tiny
          CHURN_EXPORT_DIR: ${{ runner.temp }}/tiny_export
        run: |
          .venv/bin/python scripts/build_churn_gold_local.py
          .venv/bin/python scripts/check_churn_export.py
      - name: Seed-42 N=8000 events -> gold -> contract (strict)
        run: |
          make churn-gold-local
          .venv/bin/python scripts/check_churn_export.py --strict
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Spark SQL gold vs pandas gold (pyspark 4.1.3; tiny fixture + full sample)
        run: |
          uv pip install --python .venv/bin/python "pyspark==4.1.3"
          CHURN_SAMPLE_DIR=data/sample/churn/fixtures/tiny .venv/bin/python scripts/check_gold_parity.py
          .venv/bin/python scripts/check_gold_parity.py
      - name: Retention Radar consumes the export
        # Radar main still reads the v1 export (santosh_inference_record.json); the v2 consumer that reads
        # hero_inference_record.json lives on radar's feat/coding-assistant-renewal-v2 branch (PR #18, closed
        # unmerged; head 953af3a). Use the same-named radar branch when one exists, else that branch.
        run: |
          URL=https://github.com/santoshshinde2012/retention-radar.git
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if git ls-remote --exit-code --heads "$URL" "$BRANCH" >/dev/null; then REF="$BRANCH"; else REF=feat/coding-assistant-renewal-v2; fi
          echo "retention-radar ref: $REF"
          git clone --depth 1 --branch "$REF" "$URL" "$RUNNER_TEMP/retention-radar"
          RADAR_CHECKOUT_READY=1 ./pipelines/radar_consume.sh "$GITHUB_WORKSPACE/data/export" "$RUNNER_TEMP/retention-radar"

  graph:
    # Graph on gold: Tier-0 graph tests + the tiny-profile build and strict contract (no Docker).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==${UV_VERSION}"
      - run: make graph-venv
      - name: Graph tests
        run: .venv-graph/bin/python -m pytest -q tests/graph
      - name: Tiny profile build + strict contract
        run: |
          make graph-sample PROFILE=tiny
          make graph-local PROFILE=tiny

  t2-light:
    # T1 (testcontainers) + T2 (compose light profile smoke + light demo) on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==${UV_VERSION}"
      - run: make venv
      - name: "objectstore.localhost -> loopback (required: plain glibc does not resolve *.localhost; only systemd-resolved / nss-myhostname do)"
        run: echo "127.0.0.1 objectstore.localhost" | sudo tee -a /etc/hosts
      - name: Validate Compose files and profiles
        run: |
          cp .env.example .env
          docker compose --profile light config -q
          docker compose --profile full --profile trino config -q
          docker compose -f docker-compose.yml -f docker-compose.silo.yml --profile light config -q
          docker compose -f docker-compose.yml -f docker-compose.graph.yml --profile full config -q
          cp .env.example /tmp/airflow.env && printf 'AIRFLOW_DB_PASSWORD=x\nAIRFLOW_FERNET_KEY=x\n_AIRFLOW_WWW_USER_PASSWORD=x\nAIRFLOW_JWT_SECRET=x\nAIRFLOW_API_SECRET_KEY=x\n' >> /tmp/airflow.env
          docker compose --env-file /tmp/airflow.env -f docker-compose.yml -f docker-compose.airflow.yml --profile full config -q
      - name: T1 contract (testcontainers)
        run: make test-t1
      - name: T2 light smoke
        run: make test-t2
      - name: Light demo (seed-42 churn sample first; data/sample/churn is generated, not committed)
        run: |
          make churn-sample
          .venv/bin/python scripts/light_demo.py all
      - name: Logs on failure
        if: failure()
        run: docker compose --profile '*' logs --tail 200
      - name: Down
        if: always()
        run: docker compose --profile '*' down -v

  t3-full:
    # T3: full profile cross-engine parity. Push to main, or a PR labelled "full-stack".
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-stack')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install "uv==${UV_VERSION}"
      - run: make venv
      - run: echo "127.0.0.1 objectstore.localhost" | sudo tee -a /etc/hosts
      - name: Spark (uid 185) writes data/export
        run: chmod a+rwx data/export
      - name: Seed-42 sample
        run: make churn-sample
      - name: T3 parity (Spark 4.1.3 + Trino 483 vs DuckDB / PyIceberg / Polars)
        run: make test-t3
      - name: Logs on failure
        if: failure()
        run: docker compose --profile '*' logs --tail 200
      - name: Down
        if: always()
        run: docker compose --profile '*' down -v
