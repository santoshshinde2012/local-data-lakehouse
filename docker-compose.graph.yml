# Graph-on-gold overlay: a Python 3.12 container (ldl-graph) that reads the lakehouse through
# PyIceberg (the Lakekeeper REST catalog, vended credentials) and builds / checks / serves the
# renewal graph, plus one extra mount on the Spark service so the Spark graph job and ldl-graph
# share $GRAPH_ROOT. Part of the full profile.
#
# Always pass BOTH files, base first (this file is not a valid project on its own):
#   docker compose -f docker-compose.yml -f docker-compose.graph.yml --profile full up -d --build --wait
#   ./pipelines/run_graph_e2e.sh          # Spark publish -> PyIceberg build -> contract -> ... -> promote
# `make down` loads every overlay, so it stops ldl-graph too.
# Switching between plain `make up-full` and this overlay recreates ldl-spark (its config hash changes).
#
# TEACHING-ONLY / NOT PRODUCTION:
# - The graph container holds NO credentials: no database URI and no S3 keys. It talks to the REST
#   catalog only (GET requests), and S3 access comes from the short-lived, per-table credentials
#   Lakekeeper vends. (Lakekeeper runs without authentication in this stack, see docker-compose.yml.)
# - No published ports, no Docker socket, non-root, read-only root filesystem, every capability
#   dropped. The only writable paths are ./data/graph and a tmpfs /tmp.
# - Python in a container must use the fsspec FileIO (s3fs): pyarrow's bundled AWS SDK resolves
#   *.localhost to the container itself, so objectstore.localhost (the vended endpoint) would fail.
# GRAPH_HOST_ROOT (default ./data/graph) is the host directory behind /opt/data/graph in both
# containers (for example a scratch directory for a verification run); it must exist before `up`.

services:
  spark:
    # Merged into the base service: `volumes` are appended (unique by container path) and
    # `environment` keys added; nothing of the base service changes.
    environment:
      GRAPH_ROOT: /opt/data/graph
    volumes:
      - ${GRAPH_HOST_ROOT:-./data/graph}:/opt/data/graph

  graph:
    build:
      context: .
      dockerfile: docker/graph/Dockerfile
    image: ldl-graph:local
    container_name: ldl-graph
    profiles: [full]
    depends_on:
      lakehouse-init:
        condition: service_healthy
    environment:
      GRAPH_ROOT: /opt/data/graph
      # The default profile's bronze CSVs and exports inside this container (the repo's own by default;
      # e.g. GRAPH_CHURN_SAMPLE_DIR=/opt/lakehouse/data/sample/churn/fixtures/tiny after loading the
      # lakehouse from the tiny fixture). Every `docker exec` (the lakehouse_graph DAG) inherits them.
      CHURN_SAMPLE_DIR: ${GRAPH_CHURN_SAMPLE_DIR:-/opt/lakehouse/data/sample/churn}
      CHURN_EXPORT_DIR: ${GRAPH_CHURN_EXPORT_DIR:-/opt/lakehouse/data/export}
      PYTHONPATH: /opt/lakehouse/src
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
      # PyIceberg RestCatalog over the SAME Lakekeeper catalog Spark uses (config/spark-defaults.conf).
      PYICEBERG_CATALOG__LAKEHOUSE__TYPE: rest
      PYICEBERG_CATALOG__LAKEHOUSE__URI: http://lakekeeper:8181/catalog
      PYICEBERG_CATALOG__LAKEHOUSE__WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:-lakehouse}
      PYICEBERG_CATALOG__LAKEHOUSE__HEADER__X_ICEBERG_ACCESS_DELEGATION: vended-credentials
      PYICEBERG_CATALOG__LAKEHOUSE__PY_IO_IMPL: pyiceberg.io.fsspec.FsspecFileIO
      # Always next to the endpoint: without a region the S3 client asks real AWS.
      PYICEBERG_CATALOG__LAKEHOUSE__S3__REGION: ${S3_REGION:-us-east-1}
    working_dir: /opt/lakehouse
    volumes:
      # Repo-shaped, read-only tree (lakehouse_graph.spec.repo_root() = /opt/lakehouse).
      - ./src:/opt/lakehouse/src:ro
      - ./scripts:/opt/lakehouse/scripts:ro
      - ./config:/opt/lakehouse/config:ro
      - ./sql:/opt/lakehouse/sql:ro
      - ./data/sample:/opt/lakehouse/data/sample:ro
      - ./data/export:/opt/lakehouse/data/export:ro
      # Read by the Tier-0 lineage extractor only.
      - ./airflow/dags:/opt/lakehouse/airflow/dags:ro
      - ./pipelines:/opt/lakehouse/pipelines:ro
      - ./.github/workflows:/opt/lakehouse/.github/workflows:ro
      - ./Makefile:/opt/lakehouse/Makefile:ro
      - ./README.md:/opt/lakehouse/README.md:ro
      # The only writable mount: graph builds, logs, lock (the same container path as in ldl-spark).
      - ${GRAPH_HOST_ROOT:-./data/graph}:/opt/data/graph
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    # Linux hosts: run as your own uid so ./data/graph stays yours (GRAPH_UID=$(id -u) GRAPH_GID=$(id -g)).
    # Docker Desktop / Colima (virtiofs) map ownership for you; the default matches the image user.
    user: "${GRAPH_UID:-10001}:${GRAPH_GID:-10001}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    # The seed-42 build from Iceberg holds the Iceberg-sourced and the local-path tables at once,
    # plus the Ladybug loader subprocess: measured peak in the Docker run is recorded in docs.
    mem_limit: 1536m
    pids_limit: 256
    command: ["sleep", "infinity"]
    networks:
      - lakehouse
    # No ports: MCP is stdio (docker compose ... exec -T graph ...), nothing listens.
