# Trino 483 -> Lakekeeper REST catalog, warehouse `lakehouse` (LAKEKEEPER_WAREHOUSE in .env.example).
# Vended credentials: Trino takes the per-table S3 credentials Lakekeeper returns, so no S3 keys
# here. The native S3 filesystem still needs the endpoint / region / path style of the store.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=lakehouse
iceberg.rest-catalog.vended-credentials-enabled=true
iceberg.unique-table-location=true
fs.native-s3.enabled=true
s3.endpoint=http://objectstore.localhost:9000
s3.region=us-east-1
s3.path-style-access=true
