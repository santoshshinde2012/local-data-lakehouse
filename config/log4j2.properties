# Spark 4 driver logging for ldl-spark: WARN on the console (jobs print their own results).
# Mounted at /opt/spark/conf/log4j2.properties (docker-compose.yml).
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex
logger.iceberg.name = org.apache.iceberg
logger.iceberg.level = warn
# Spark warns once per JVM about the native Hadoop library on Linux containers: harmless.
logger.nativeloader.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativeloader.level = error
