# Apache Spark defaults for local lakehouse (Iceberg JDBC catalog + MinIO via S3A)
# Mounted into the Spark container at /opt/spark/conf/spark-defaults.conf

spark.sql.extensions                                  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                              lakehouse

spark.sql.catalog.lakehouse                           org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.catalog-impl              org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.lakehouse.uri                       jdbc:postgresql://postgres:5432/iceberg
spark.sql.catalog.lakehouse.jdbc.user                 iceberg
spark.sql.catalog.lakehouse.jdbc.password             iceberg
spark.sql.catalog.lakehouse.jdbc.useSSL               false
spark.sql.catalog.lakehouse.warehouse                 s3a://lake/warehouse
spark.sql.catalog.lakehouse.default-namespace         bronze

# MinIO via Hadoop S3A (path-style)
spark.hadoop.fs.s3a.impl                              org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                          http://minio:9000
spark.hadoop.fs.s3a.access.key                        minioadmin
spark.hadoop.fs.s3a.secret.key                        minioadmin
spark.hadoop.fs.s3a.path.style.access                 true
spark.hadoop.fs.s3a.connection.ssl.enabled            false
spark.hadoop.fs.s3a.aws.credentials.provider          org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Local-friendly defaults
spark.master                                          local[*]
spark.sql.shuffle.partitions                          4
spark.driver.memory                                   2g
spark.executor.memory                                 2g
spark.ui.port                                         4040
