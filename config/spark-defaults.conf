# Apache Spark 4.1 defaults: Iceberg 1.11 REST catalog (Lakekeeper) with vended credentials.
# Mounted at /opt/spark/conf/spark-defaults.conf in ldl-spark (docker-compose.yml, profile full).
#
# No secrets here. Spark authenticates to nothing: Lakekeeper (auth disabled, teaching stack)
# returns short-lived S3 credentials + the S3 endpoint with every loadTable, and Iceberg's
# S3FileIO uses them. S3 keys live only in .env (object store + Lakekeeper's warehouse).
# The warehouse NAME (lakehouse) is the value of LAKEKEEPER_WAREHOUSE in .env.example; if you
# change it there, pass --conf spark.sql.catalog.lakehouse.warehouse=<name> (run_job.sh does).

spark.sql.extensions                                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                                     lakehouse

spark.sql.catalog.lakehouse                                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                             rest
spark.sql.catalog.lakehouse.uri                              http://lakekeeper:8181/catalog
spark.sql.catalog.lakehouse.warehouse                        lakehouse
spark.sql.catalog.lakehouse.header.X-Iceberg-Access-Delegation vended-credentials
spark.sql.catalog.lakehouse.io-impl                          org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.default-namespace                bronze

# Local-friendly defaults
spark.master                                                 local[*]
spark.sql.shuffle.partitions                                 4
spark.driver.memory                                          2g
spark.ui.port                                                4040
spark.sql.session.timeZone                                   UTC
